<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Login - SecureGate Firewall</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #2b2b2b; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: #3c3c3c; width: 400px; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header { background: #cf1b1b; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; font-weight: normal; }
        .form-area { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #555; background: #222; color: #fff; box-sizing: border-box; border-radius: 2px; }
        .form-group input:focus { outline: none; border-color: #cf1b1b; }
        .submit-btn { width: 100%; padding: 12px; background: #cf1b1b; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 2px; }
        .submit-btn:hover { background: #a81515; }
        .error { color: #ff6b6b; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .footer { text-align: center; padding: 15px; font-size: 12px; color: #777; background: #333; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h1>SecureGate</h1>
        </div>
        <div class="form-area">
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
        <div class="footer">
            Warning: This system is for authorized users only. All activities are monitored.
        </div>
    </div>
</body>
</html>
