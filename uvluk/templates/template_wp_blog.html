<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; background: #f1f1f1; color: #3c434a; margin: 0; padding: 0; }
        header { background: #fff; border-bottom: 1px solid #ddd; padding: 40px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 2rem; color: #2271b1; }
        header p { color: #50575e; margin-top: 10px; }
        main { max-width: 800px; margin: 40px auto; background: #fff; padding: 40px; border: 1px solid #ddd; border-radius: 4px; }
        article h2 { color: #1d2327; }
        article .meta { color: #646970; font-size: 0.9rem; margin-bottom: 20px; }
        footer { text-align: center; padding: 20px; color: #646970; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>My Personal Blog</h1>
        <p>Just another WordPress site</p>
    </header>
    <main>
        <article>
            <h2>Hello world!</h2>
            <div class="meta">Published on <script>document.write(new Date().toLocaleDateString());</script> by Admin</div>
            <p>Welcome to WordPress. This is your first post. Edit or delete it, then start writing!</p>
            <p>If you're the site owner, log in to the <a href="/wp-login.php">admin dashboard</a> to manage your content.</p>
        </article>
    </main>
    <footer>
        Proudly powered by WordPress
    </footer>
</body>
</html>
