<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In &lsaquo; My Personal Blog &#8212; WordPress</title>
    <style>
        body { background: #f0f0f1; color: #3c434a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; font-size: 14px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login { width: 320px; padding: 8% 0 0; margin: auto; }
        h1 { text-align: center; margin-bottom: 25px; }
        h1 a { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%231d2327"/><path fill="%23fff" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c.45 0 .7.18.94.4.24.23.36.56.36.96 0 .6-.2 1.3-.57 2.15l-2.6 6.13h-2.1L10 12.3l-2.65 6.14H5.2l3.4-8.08c-.28-.7-.43-1.3-.43-1.83 0-.58.18-.95.4-.1.3.1.58.1.84.1.33 0 .54-.15.54-.42 0-.27-.12-.6-.35-.98-.2-.35-.35-.7-.35-1 0-.6.4-1.15 1.1-1.15.5 0 .9.2 1.15.5.25.3.38.7.38 1.15 0 .4-.1.85-.35 1.35-.2.4-.3.8-.3 1.1 0 .2.1.35.3.45.18.1.4.15.65.15z"/></svg>'); background-size: 84px; background-position: center top; background-repeat: no-repeat; color: #3c434a; display: block; height: 84px; font-size: 20px; line-height: 1.3; margin: 0 auto 25px; outline: 0; text-decoration: none; width: 84px; text-indent: -9999px; }
        form { background: #fff; border: 1px solid #c3c4c7; box-shadow: 0 1px 3px rgba(0,0,0,.04); padding: 24px; border-radius: 4px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="password"] { border: 1px solid #8c8f94; border-radius: 4px; box-shadow: inset 0 1px 2px rgba(0,0,0,.07); color: #2c3338; font-size: 24px; margin-bottom: 16px; padding: 3px 5px; width: 100%; box-sizing: border-box; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #2271b1; box-shadow: 0 0 0 1px #2271b1; }
        .submit-wrap { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .button { background: #2271b1; border: 1px solid #2271b1; border-radius: 3px; color: #fff; cursor: pointer; display: inline-block; font-size: 13px; line-height: 2.15384615; min-height: 32px; padding: 0 12px; text-decoration: none; text-shadow: none; }
        .button:hover { background: #135e96; }
        .forgetmenot { display: flex; align-items: center; gap: 5px; }
        .error { background: #fff; border-left: 4px solid #d63638; box-shadow: 0 1px 1px 0 rgba(0,0,0,.1); margin: 0 0 20px; padding: 12px; }
        .nav { text-align: center; margin-top: 20px; font-size: 13px; }
        .nav a { color: #2271b1; text-decoration: none; }
        .nav a:hover { color: #0a4b78; }
    </style>
</head>
<body>
    <div class="login">
        <h1><a href="#">Powered by WordPress</a></h1>
        
        {% if error %}
        <div class="error">
            <strong>ERROR</strong>: {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="">
            <p>
                <label for="user_login">Username or Email Address</label>
                <input type="text" name="log" id="user_login" class="input" value="" size="20" required>
            </p>
            <p>
                <label for="user_pass">Password</label>
                <input type="password" name="pwd" id="user_pass" class="input" value="" size="20" required>
            </p>
            <div class="submit-wrap">
                <div class="forgetmenot">
                    <input name="rememberme" type="checkbox" id="rememberme" value="forever">
                    <label for="rememberme" style="margin:0;">Remember Me</label>
                </div>
                <input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In">
            </div>
        </form>
        
        <p class="nav">
            <a href="#">Lost your password?</a>
        </p>
        <p class="nav" style="margin-top: 10px;">
            <a href="#">&larr; Go to My Personal Blog</a>
        </p>
    </div>
</body>
</html>
