<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uvluk Analytics - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-container img {
            max-width: 320px;
            height: auto;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <!-- Using the Full Logo here as requested! -->
        <img src="{{ url_for('static', filename='img/logo-full.png') }}" alt="Uvluk Analytics">
    </div>
    
    <h5 class="text-center mb-4 text-muted">Admin Authentication</h5>
    
    {% if error %}
    <div class="alert alert-danger p-2 text-center small" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100 py-2">Sign In</button>
    </form>
</div>

</body>
</html>
